services:
  - type: web
    name: remote-atlas-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # Keep lean — no fastembed/ONNX (would OOM free 512MB).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m app.deploy web
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Cross-origin: Vercel site → Render API requires SameSite=None + Secure
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: FRESHNESS_DAYS
        value: "30"
      # Never load BGE/ONNX on the free web dyno (cron embeds jobs offline).
      - key: EMBED_PROVIDER
        value: none
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false

  # Daily full crawl at 06:00 Pakistan Time (PKT = UTC+5) → 01:00 UTC.
  # Starter plan required for long multi-source + local embed runs.
  - type: cron
    name: remote-atlas-ingest
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    schedule: "0 1 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements-ingest.txt
    startCommand: python -m app.deploy cron --embed
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: FRESHNESS_DAYS
        value: "30"
      - key: INGEST_CONCURRENCY
        value: "8"
      - key: EMBED_PROVIDER
        value: local
      - key: THE_MUSE_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
